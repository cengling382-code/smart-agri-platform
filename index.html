<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fcfcfd" />
    <meta name="description" content="智慧农业综合管理平台 - 物联网感知、远程控制、数据分析、农产品溯源一体化管理" />
    <title>智慧农业综合管理平台</title>
    <style>
      #boot-loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#fcfcfd;color:#16191f;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
      #boot-loading .boot-mark{font-size:34px;line-height:1}
      #boot-loading .boot-text{font-size:16px;font-weight:600;letter-spacing:1px}
      #boot-loading .boot-sub{font-size:12px;color:#6b7380}
      #boot-loading .boot-bar{width:160px;height:3px;border-radius:3px;background:#e9ebef;overflow:hidden;margin-top:6px}
      #boot-loading .boot-bar i{display:block;width:40%;height:100%;border-radius:3px;background:#074ce0;animation:bootSlide 1.1s ease-in-out infinite}
      @keyframes bootSlide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot-loading" role="status" aria-live="polite">
        <div class="boot-mark">🌱</div>
        <div class="boot-text">智慧农业综合管理平台</div>
        <div class="boot-sub">正在加载，请稍候…</div>
        <div class="boot-bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
